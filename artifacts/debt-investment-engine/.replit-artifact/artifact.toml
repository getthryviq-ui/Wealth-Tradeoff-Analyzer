kind = "web"
previewPath = "/"
title = "Debt-to-Investment Tradeoff Engine"
version = "1.0.0"
id = "artifacts/debt-investment-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22438

[services.development]
run = "pnpm --filter @workspace/debt-investment-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/debt-investment-engine", "run", "build" ]
publicDir = "artifacts/debt-investment-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22438"
BASE_PATH = "/"
